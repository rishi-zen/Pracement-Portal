{% extends "base.html" %}
{% block content %}
<div class="text-center mt-5">
    <h1 class="display-4">Welcome to the Placement Portal</h1>
    <p class="lead">Connecting top students with industry-leading companies.</p>
    {% if not current_user.is_authenticated %}
        <a href="/register" class="btn btn-primary btn-lg mt-3">Get Started</a>
        <a href="/login" class="btn btn-outline-dark btn-lg mt-3 ms-2">Login</a>
    {% endif %}
</div>
{% endblock %}
